services:
  - type: web
    name: taskhq
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --worker-class gthread --threads 100 --workers 1 main:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskhq-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: USER_PASSWORD
        sync: false
      - key: MANAGER_PASSWORD
        sync: false

databases:
  - name: taskhq-db
    databaseName: taskhq
    user: taskhq